{% extends 'cuentas/base.html' %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<p class="eyebrow">CUENTA AERIS</p>
<h1>Inicia <em>sesión.</em></h1>
{% include 'cuentas/_error.html' %}
<form method="post" class="cuenta-form" action="{{ url_for('cuentas.entrar') }}" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="siguiente" value="{{ siguiente or '' }}">
  <label>Correo<input type="email" name="correo" value="{{ correo or '' }}" autocomplete="email" maxlength="254" required></label>
  <label>Contraseña<input type="password" name="contrasena" autocomplete="current-password" maxlength="128" required></label>
  <button class="button primary" type="submit">Entrar</button>
</form>
<p class="cuenta-pie"><a href="{{ url_for('cuentas.recuperar') }}">¿Olvidaste tu contraseña?</a> · ¿No tienes cuenta? <a href="{{ url_for('cuentas.registro') }}">Créala</a></p>
{% endblock %}
