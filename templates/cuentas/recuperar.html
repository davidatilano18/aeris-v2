{% extends 'cuentas/base.html' %}
{% block titulo %}Recuperar contraseña{% endblock %}
{% block contenido %}
<p class="eyebrow">CUENTA AERIS</p>
<h1>Recupera tu <em>contraseña.</em></h1>
<p class="cuenta-lead">Escribe tu correo y te enviaremos un enlace para elegir una nueva.</p>
{% include 'cuentas/_error.html' %}
<form method="post" class="cuenta-form" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Correo<input type="email" name="correo" autocomplete="email" maxlength="254" required></label>
  <button class="button primary" type="submit">Enviar enlace</button>
</form>
<p class="cuenta-pie"><a href="{{ url_for('cuentas.entrar') }}">Volver a iniciar sesión</a></p>
{% endblock %}
